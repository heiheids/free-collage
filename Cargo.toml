[package]
name = "puzzle-studio"
version = "1.0.0"
edition = "2021"
authors = ["黑山大叔"]
description = "自由拼图 - 轻量级自由拼图与标注工具"
homepage = "https://github.com/heiheids/free-collage"
repository = "https://github.com/heiheids/free-collage"
license = "GPL-3.0-only"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "PuzzleStudio"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
tiny-skia = "0.11.4"
webp = { version = "0.3.1", default-features = false }
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
